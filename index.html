<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="description" content="Westside Tattoo Mermaid Beach — Gold Coast tattoo studio since 1998. All styles for all people.">
<meta name="theme-color" content="#000000">
<title>Westside Tattoo Mermaid Beach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800;900&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --blk:#000;--blk2:#0B0B0B;--blk3:#141414;--blk4:#1C1C1C;
  --ln:#252525;--ln2:#3A3A3A;--ln3:#555;
  --wht:#FFF;--bone:#E8E6E1;--mid:#9A978F;--dim:#6B6862;
  --pap:#F4F3F0;--pap2:#E4E2DD;
  --flag:#C4342A;
  --d:"Big Shoulders Display","Helvetica Neue",Arial,sans-serif;
  --b:"Archivo","Helvetica Neue",Arial,sans-serif;
  --m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--blk);color:var(--bone);font-family:var(--b);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:52px}
img{max-width:100%;display:block}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--wht);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

h1,h2,h3,.dp{font-family:var(--d);text-transform:uppercase;font-weight:800;
  letter-spacing:.01em;line-height:.9;margin:0;color:var(--wht)}
.mono{font-family:var(--m)}
.lbl{font-family:var(--m);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.wrap{max-width:1280px;margin:0 auto;padding-inline:20px}
.nar{max-width:640px}

/* wedge — their homepage device */
.wedge{height:54px;background:var(--blk);clip-path:polygon(0 0,100% 0,100% 100%,0 42%)}
.wedge.up{clip-path:polygon(0 58%,100% 0,100% 100%,0 100%)}
.wedge.pap{background:var(--pap)}

/* ---------- demo bar ---------- */
#demobar{position:fixed;left:0;right:0;bottom:0;z-index:900;background:#000;
  border-top:1px solid var(--ln2);display:flex;align-items:center;gap:4px;
  padding:0 10px;height:52px;overflow-x:auto}
#demobar .dl{font-family:var(--m);font-size:9px;letter-spacing:.16em;color:var(--ln3);
  text-transform:uppercase;padding-right:10px;white-space:nowrap;border-right:1px solid var(--ln);margin-right:6px}
.dbtn{font-family:var(--m);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:8px 11px;border:1px solid var(--ln2);color:var(--mid);white-space:nowrap}
.dbtn:hover{color:var(--wht);border-color:var(--ln3)}
.dbtn.on{background:var(--wht);color:#000;border-color:var(--wht)}
.dbtn.tog.on{background:var(--flag);color:#fff;border-color:var(--flag)}
#demobar .sp{margin-left:auto}

/* ---------- needs-confirming ---------- */
.nc{border-bottom:1px dashed var(--ln3)}
body.showflags .nc{background:rgba(196,52,42,.17);border-bottom-color:var(--flag);
  box-shadow:0 0 0 2px rgba(196,52,42,.17)}
.ncnote{display:none;font-family:var(--m);font-size:9.5px;letter-spacing:.08em;
  color:var(--flag);text-transform:uppercase;margin-top:4px}
body.showflags .ncnote{display:block}

/* ---------- asset request card ---------- */
.need{border:1px dashed var(--ln2);background:
  repeating-linear-gradient(135deg,rgba(255,255,255,.018) 0 6px,transparent 6px 12px);
  display:flex;flex-direction:column;justify-content:center;gap:6px;padding:14px;min-height:100%}
.need .nh{font-family:var(--m);font-size:8.5px;letter-spacing:.14em;color:var(--flag);text-transform:uppercase}
.need .nb{font-family:var(--m);font-size:10.5px;line-height:1.5;color:var(--mid)}
.iw{position:relative;overflow:hidden;background:var(--blk3)}
.iw img{width:100%;height:100%;object-fit:cover}

/* ---------- site ---------- */
.snav{position:sticky;top:0;z-index:60;background:#000;border-bottom:1px solid var(--ln)}
.snav-in{max-width:1280px;margin:0 auto;padding:0 20px;height:62px;display:flex;align-items:center;gap:18px}
.logo{height:26px;width:auto;object-fit:contain}
.logofall{font-family:var(--d);font-weight:900;font-size:19px;letter-spacing:.04em;color:var(--wht);text-transform:uppercase;line-height:1}
.snav .links{margin-left:auto;display:flex;gap:22px;align-items:center}
.snav .links a{font-family:var(--m);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--mid);text-decoration:none}
.snav .links a:hover{color:var(--wht)}
.bk{font-family:var(--m);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  background:var(--wht);color:#000;padding:11px 16px;text-decoration:none;display:inline-block}
.bk:hover{background:var(--bone)}
.bk.gh{background:none;color:var(--bone);border:1px solid var(--ln2)}
.bk.gh:hover{border-color:var(--wht);color:var(--wht);background:none}
@media(max-width:760px){.snav .links a.hs{display:none}}

.hero{padding:clamp(34px,5vw,62px) 0 0}
.hero h1{font-size:clamp(58px,12vw,168px);line-height:.82;letter-spacing:-.01em}
.hero .sub{font-family:var(--m);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--mid);margin:20px 0 0}
.hgal{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:30px}
.hgal .iw{aspect-ratio:3/4}
.hgal .iw:nth-child(n+5){display:none}
@media(max-width:820px){.hgal{grid-template-columns:repeat(2,1fr)}}

.tick{border-block:1px solid var(--ln);background:#000;overflow:hidden;padding:11px 0;margin-top:30px}
.tickt{display:flex;white-space:nowrap;animation:tk 34s linear infinite}
.tickt span{font-family:var(--d);font-weight:900;font-size:15px;letter-spacing:.26em;
  color:var(--ln2);padding-right:30px;text-transform:uppercase}
@keyframes tk{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.tickt{animation:none}}

.sec{padding-block:clamp(46px,7vw,84px);border-bottom:1px solid var(--ln)}
.sech{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.sech h2{font-size:clamp(30px,5vw,54px)}
.sech p{color:var(--mid);margin:10px 0 0;max-width:52ch}

/* artists */
.agrid{display:grid;gap:3px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.acard{background:var(--blk2);display:flex;flex-direction:column;text-align:left;width:100%}
.acard:hover{background:var(--blk3)}
.acard .iw{aspect-ratio:4/5}
.acard .ab{padding:14px 15px 17px;display:flex;flex-direction:column;gap:7px;flex:1}
.acard h3{font-size:24px}
.acard .st{font-size:14px;color:var(--mid);line-height:1.45}
.acard .ig{font-family:var(--m);font-size:10px;letter-spacing:.08em;color:var(--dim);margin-top:auto;padding-top:10px}

/* faq — their mock-dialogue format is the brand device */
.qa{border-top:1px solid var(--ln)}
.qa .q{width:100%;text-align:left;display:grid;grid-template-columns:1fr auto;gap:16px;
  padding:19px 0;align-items:start}
.qa .q h3{font-size:20px;text-transform:none;font-family:var(--b);font-weight:600;
  letter-spacing:0;line-height:1.35;color:var(--bone)}
.qa .q .pm{font-family:var(--m);font-size:15px;color:var(--dim)}
.qa .a{padding:0 0 22px;max-width:66ch;color:var(--mid);font-size:15.5px}
.qa .a p{margin:0 0 .8em}
.qa .a p:last-child{margin:0}

/* info rows */
.rows{border-top:1px solid var(--ln)}
.row{display:grid;grid-template-columns:180px 1fr;gap:20px;padding:15px 0;border-bottom:1px solid var(--ln)}
.row dt{font-family:var(--m);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.row dd{margin:0;color:var(--bone)}
@media(max-width:620px){.row{grid-template-columns:1fr;gap:5px}}

/* ---------- booking flow ---------- */
.flow{min-height:100vh;background:var(--blk)}
.fbar{position:sticky;top:0;z-index:50;background:#000;border-bottom:1px solid var(--ln)}
.fbar-in{max-width:820px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px}
.prog{flex:1;height:2px;background:var(--ln);position:relative}
.prog i{position:absolute;inset:0 auto 0 0;background:var(--wht);transition:width .3s ease}
.fstep{max-width:820px;margin:0 auto;padding:clamp(34px,6vw,64px) 20px 60px}
.fq{font-family:var(--d);text-transform:uppercase;font-weight:800;
  font-size:clamp(34px,6.5vw,64px);line-height:.92;color:var(--wht);margin:0 0 10px}
.fhelp{color:var(--mid);margin:0 0 26px;max-width:56ch;font-size:16px}
.opts{display:grid;gap:3px}
.opt{background:var(--blk2);padding:17px 18px;display:flex;align-items:center;gap:14px;
  text-align:left;width:100%;border:1px solid transparent}
.opt:hover{background:var(--blk3)}
.opt[aria-pressed=true]{border-color:var(--wht);background:var(--blk3)}
.opt .ot{font-family:var(--d);font-size:21px;text-transform:uppercase;font-weight:700;color:var(--wht);line-height:1}
.opt .od{font-size:14.5px;color:var(--mid);margin-top:4px}
.opt .oi{margin-left:auto;font-family:var(--m);font-size:11px;color:var(--dim)}
.ogrid{display:grid;gap:3px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.ocell{background:var(--blk2);padding:15px;text-align:left;border:1px solid transparent}
.ocell:hover{background:var(--blk3)}
.ocell[aria-pressed=true]{border-color:var(--wht);background:var(--blk3)}
.ocell .ot{font-family:var(--d);font-size:17px;text-transform:uppercase;font-weight:700;color:var(--wht);line-height:1.05}
.ocell .od{font-size:13px;color:var(--dim);margin-top:5px;line-height:1.4}
.apick{display:grid;gap:3px;grid-template-columns:repeat(auto-fill,minmax(158px,1fr))}
.apick button{background:var(--blk2);text-align:left;border:1px solid transparent;overflow:hidden}
.apick button:hover{background:var(--blk3)}
.apick button[aria-pressed=true]{border-color:var(--wht)}
.apick .iw{aspect-ratio:1}
.apick .pn{font-family:var(--d);font-size:17px;text-transform:uppercase;font-weight:700;
  color:var(--wht);padding:10px 12px 2px;line-height:1}
.apick .ps{font-size:12.5px;color:var(--dim);padding:0 12px 12px;line-height:1.4}

textarea,input[type=text],input[type=email],input[type=tel]{
  width:100%;background:var(--blk2);border:1px solid var(--ln);color:var(--bone);
  font-family:var(--b);font-size:16px;padding:14px;resize:vertical}
textarea:focus,input:focus{border-color:var(--ln3);outline:none}
textarea::placeholder,input::placeholder{color:var(--ln3)}

.drop{border:1px dashed var(--ln2);padding:26px 20px;text-align:center;color:var(--mid);
  font-size:15px;cursor:pointer;background:var(--blk2)}
.drop:hover{border-color:var(--ln3);background:var(--blk3)}
.thumbs{display:grid;gap:3px;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));margin-top:3px}
.thumb{position:relative;aspect-ratio:1;background:var(--blk3);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .x{position:absolute;top:0;right:0;background:#000;color:#fff;font-family:var(--m);
  font-size:11px;padding:5px 8px;line-height:1}
.thumb .x:hover{background:var(--flag)}

.fnav{display:flex;gap:10px;align-items:center;margin-top:30px;padding-top:22px;border-top:1px solid var(--ln)}
.fnav .back{font-family:var(--m);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.fnav .back:hover{color:var(--wht)}
.fnav .sp{margin-left:auto}
.skip{font-family:var(--m);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ln3)}
.skip:hover{color:var(--mid)}

.rev{border-top:1px solid var(--ln)}
.revr{display:grid;grid-template-columns:150px 1fr auto;gap:16px;padding:13px 0;border-bottom:1px solid var(--ln);align-items:start}
.revr dt{font-family:var(--m);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.revr dd{margin:0;color:var(--bone);font-size:15.5px}
.revr .ed{font-family:var(--m);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ln3)}
.revr .ed:hover{color:var(--wht)}
@media(max-width:640px){.revr{grid-template-columns:1fr auto}.revr dt{grid-column:1/-1}}

.note{background:var(--blk2);border-left:2px solid var(--ln2);padding:15px 17px;margin:24px 0;color:var(--mid);font-size:15px}
.note b{color:var(--bone);font-weight:600}

/* ---------- the book (artist) ---------- */
.bk-shell{min-height:100vh;background:var(--blk)}
.bk-top{background:#000;border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:50}
.bk-top-in{max-width:1280px;margin:0 auto;padding:0 20px;height:58px;display:flex;align-items:center;gap:18px}
.bk-top .who{margin-left:auto;display:flex;align-items:center;gap:10px}
.bk-top .who .av{width:30px;height:30px;overflow:hidden;background:var(--blk3);flex:none}
.bk-top .who .av img{width:100%;height:100%;object-fit:cover}
.bk-tabs{display:flex;gap:0;border-bottom:1px solid var(--ln);background:#000;overflow-x:auto}
.bk-tabs button{font-family:var(--m);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  padding:14px 16px;color:var(--dim);border-bottom:2px solid transparent;white-space:nowrap}
.bk-tabs button:hover{color:var(--bone)}
.bk-tabs button.on{color:var(--wht);border-bottom-color:var(--wht)}
.bk-tabs .ct{font-family:var(--m);font-size:9.5px;color:var(--blk);background:var(--mid);
  padding:1px 5px;margin-left:6px;vertical-align:1px}
.bk-tabs button.on .ct{background:var(--wht)}

.hello{padding:26px 0 20px}
.hello h2{font-size:clamp(28px,4.4vw,44px)}
.tally{display:flex;gap:0;flex-wrap:wrap;border-top:1px solid var(--ln);margin-top:18px}
.tally div{padding:14px 22px 14px 0;margin-right:22px;border-right:1px solid var(--ln);flex:0 0 auto}
.tally div:last-child{border-right:none}
.tally dt{font-family:var(--m);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.tally dd{margin:3px 0 0;font-family:var(--d);font-weight:800;font-size:30px;color:var(--wht);line-height:1}
.tally dd.hot{color:var(--flag)}

.q-list{display:grid;gap:3px;padding-bottom:40px}
.qc{background:var(--blk2);display:grid;grid-template-columns:112px 1fr auto;gap:18px;
  padding:16px;text-align:left;width:100%;align-items:start;border-left:2px solid transparent}
.qc:hover{background:var(--blk3)}
.qc.mine{border-left-color:var(--wht)}
.qc.late{border-left-color:var(--flag)}
.qc .qthumbs{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.qc .qthumbs .iw{aspect-ratio:1}
.qc h3{font-size:20px;text-transform:none;font-family:var(--b);font-weight:600;letter-spacing:0;line-height:1.3}
.qc .meta{font-family:var(--m);font-size:11px;color:var(--mid);margin-top:7px;line-height:1.8}
.qc .meta b{color:var(--bone);font-weight:500}
.qc .rt{text-align:right;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.tag{font-family:var(--m);font-size:9px;letter-spacing:.11em;text-transform:uppercase;
  padding:4px 7px;border:1px solid var(--ln2);color:var(--mid);white-space:nowrap}
.tag.w{background:var(--wht);color:#000;border-color:var(--wht)}
.tag.r{background:var(--flag);color:#fff;border-color:var(--flag)}
.tag.o{border-color:var(--ln3);color:var(--bone)}
.ago{font-family:var(--m);font-size:10px;color:var(--dim)}
.ago.late{color:var(--flag)}
@media(max-width:700px){.qc{grid-template-columns:84px 1fr}.qc .rt{grid-column:1/-1;flex-direction:row;align-items:center}}

/* request detail */
.det{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:3px;padding-bottom:50px}
@media(max-width:920px){.det{grid-template-columns:1fr}}
.pane{background:var(--blk2);padding:22px}
.pane h3{font-size:22px;margin-bottom:12px}
.big{display:grid;gap:3px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-bottom:3px}
.big .iw{aspect-ratio:1}
.spot{display:grid;grid-template-columns:180px 1fr;gap:16px;background:var(--blk3);padding:14px;margin-top:3px}
.spot .iw{aspect-ratio:3/4}
@media(max-width:560px){.spot{grid-template-columns:1fr}}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:0;border-top:1px solid var(--ln);margin-top:18px}
.facts div{padding:12px 14px 12px 0}
.facts dt{font-family:var(--m);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.facts dd{margin:4px 0 0;color:var(--bone);font-size:15px;font-weight:500}
.quote{font-size:17px;color:var(--bone);line-height:1.6;white-space:pre-wrap}

.acts{display:grid;gap:3px;margin-top:3px}
.act{background:var(--blk3);padding:15px 17px;text-align:left;display:flex;align-items:center;gap:12px}
.act:hover{background:var(--blk4)}
.act .at{font-family:var(--d);font-size:19px;text-transform:uppercase;font-weight:700;color:var(--wht);line-height:1}
.act .ad{font-size:13.5px;color:var(--dim);margin-top:3px}
.act.main{background:var(--wht)}
.act.main .at{color:#000}
.act.main .ad{color:#444}
.act.main:hover{background:var(--bone)}

/* thread */
.thr{display:grid;gap:12px;margin-top:6px}
.msg{max-width:86%;padding:12px 14px;font-size:15px;line-height:1.5}
.msg .mw{font-family:var(--m);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--dim);margin-bottom:6px}
.msg.them{background:var(--blk3);justify-self:start}
.msg.us{background:var(--blk4);justify-self:end;border-right:2px solid var(--wht)}
.msg.sys{background:none;border:1px dashed var(--ln2);justify-self:stretch;max-width:100%;color:var(--mid);font-size:14px}

/* calendar */
.cal{background:var(--blk2);padding:20px;margin-bottom:3px}
.calhead{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cald{background:var(--blk3);min-height:96px;padding:8px;display:flex;flex-direction:column;gap:4px}
.cald.off{background:var(--blk2);opacity:.5}
.cald .dn{font-family:var(--m);font-size:10px;color:var(--dim)}
.cald .dn b{color:var(--bone);font-weight:500}
.cald .hrs{font-family:var(--m);font-size:9.5px;color:var(--ln3)}
.ev{font-family:var(--m);font-size:9.5px;padding:3px 5px;background:var(--blk);border-left:2px solid var(--ln3);line-height:1.35}
.ev.bk{border-left-color:var(--wht);color:var(--bone)}
.ev.blk{border-left-color:var(--ln2);color:var(--dim)}
.ev.new{border-left-color:var(--flag);color:var(--bone)}
.calkey{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-family:var(--m);font-size:9.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.calkey span::before{content:"";display:inline-block;width:9px;height:2px;background:var(--ln3);margin-right:6px;vertical-align:3px}
.calkey span.bk::before{background:var(--wht)}
.calkey span.new::before{background:var(--flag)}
@media(max-width:700px){.calgrid{grid-template-columns:repeat(2,1fr)}.cald{min-height:auto}}

.slots{display:grid;gap:3px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));margin-top:4px}
.slot{background:var(--blk3);padding:14px;text-align:left;border:1px solid transparent}
.slot:hover{background:var(--blk4)}
.slot[aria-pressed=true]{border-color:var(--wht);background:var(--blk4)}
.slot .sd{font-family:var(--d);font-size:19px;text-transform:uppercase;font-weight:700;color:var(--wht);line-height:1}
.slot .sh{font-family:var(--m);font-size:11.5px;color:var(--mid);margin-top:5px}

/* counter (studio) */
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:2px;margin-bottom:3px}
.pipe button{background:var(--blk2);padding:15px 14px;text-align:left;border-bottom:2px solid transparent}
.pipe button:hover{background:var(--blk3)}
.pipe button.on{border-bottom-color:var(--wht);background:var(--blk3)}

window.closeArtist=function(){

};

window.tgl = function(btn){
  var open = btn.getAttribute("aria-expanded")==="true";
  btn.setAttribute("aria-expanded", !open);
  btn.querySelector(".pm").textContent = open ? "+" : "–";
  btn.nextElementSibling.hidden = open;

window.startWith = function(id){ S.draft.route="known"; S.draft.artist=id; S.step=2; go("book"); };
</script>

<script>
/* ============================ BOOKING FLOW ============================ */
var PLACES = ["Forearm","Upper arm","Full sleeve","Hand","Chest","Ribs","Stomach","Back","Shoulder",
  "Thigh","Calf","Knee","Foot","Ankle","Neck","Somewhere else"];
var SIDED = ["Forearm","Upper arm","Full sleeve","Hand","Ribs","Shoulder","Thigh","Calf","Knee","Foot","Ankle"];
var SIZES = [["Small","Up to a matchbox. Studio minimum is $150."],
  ["Palm size","About the size of your hand flat."],
  ["Decent size","Forearm, calf, that sort of area."],
  ["Big","Half sleeve, back piece, most of a thigh. Probably more than one session."]];
var COLOURS = [["Black & grey",""],["Colour",""],["Whatever suits it","Let the artist call it."],["Not sure","We'll talk about it."]];
var JOBS = [["New tattoo",""],["Adding to something","Continuing a piece or filling a gap."],
  ["Cover-up","Going over old work."],["Touch-up","Something of ours that needs a tidy."],
  ["Fixing someone else's work",""]];
var BUDGETS = [["Under $300",""],["$300 – $600",""],["$600 – $1,000",""],["$1,000 – $2,000",""],
  ["Bigger than that","Day rates, multiple sessions."],["No idea","Tell us the idea and we'll tell you."]];
var DAYS = ["Tuesday","Wednesday","Thursday","Friday","Saturday"];
var STYLES = ["Traditional","Japanese","Neo-traditional","Fine line","Black & grey","Colour",
  "Lettering","Large scale","Not sure"];

var STEPS = [
  "route","artist","job","idea","refs","spot","place","size","colour","budget","when","you","review"
];

function stepTitle(k){ return k; }

function vBook(){
  var k = STEPS[S.step] || "route";
  var pct = Math.round((S.step/(STEPS.length-1))*100);
  var body = ({
    route:sRoute, artist:sArtist, job:sJob, idea:sIdea, refs:sRefs, spot:sSpot,
    place:sPlace, size:sSize, colour:sColour, budget:sBudget, when:sWhen, you:sYou, review:sReview
  })[k]();

  return '<div class="flow"><div class="fbar"><div class="fbar-in">'+
      '<button class="lbl" onclick="go(\'site\')">Westside</button>'+
      '<div class="prog"><i style="width:'+pct+'%"></i></div>'+
      '<span class="lbl">'+(S.step+1)+' / '+STEPS.length+'</span>'+
    '</div></div><div class="fstep">'+body+'</div></div>';
}
function head(q, help){
  return '<h1 class="fq">'+esc(q)+'</h1>'+(help?'<p class="fhelp">'+help+'</p>':'');
}
function nav(nextLabel, canNext, skip){
  return '<div class="fnav">'+
    (S.step>0?'<button class="back" onclick="stepBack()">Back</button>':'')+
    '<span class="sp"></span>'+
    (skip?'<button class="skip" onclick="stepNext()">'+esc(skip)+'</button>':'')+
    (nextLabel?'<button class="bk" onclick="stepNext()" '+(canNext?'':'disabled style="opacity:.35;cursor:not-allowed"')+'>'+esc(nextLabel)+'</button>':'')+
  '</div>';
}
window.stepNext = function(){ if(S.step<STEPS.length-1){S.step++;save();render();window.scrollTo(0,0);} };
window.stepBack = function(){ if(S.step>0){S.step--;save();render();window.scrollTo(0,0);} };
window.jumpTo = function(k){ S.step = STEPS.indexOf(k); save(); render(); window.scrollTo(0,0); };
window.setD = function(f,v){ S.draft[f]=v; save(); render(); };
window.toggleD = function(f,v){
  var a=S.draft[f]; var i=a.indexOf(v); if(i<0)a.push(v); else a.splice(i,1); save(); render();
};

function sRoute(){
  var opts=[["known","I know who I want","You've seen someone's work and that's who you want."],
            ["help","Not sure who suits it","Tell us the idea and we'll put it in front of whoever it's right for."],
            ["any","Whoever can get me in soonest","You're not fussy about who does it."]];
  return head("Who's doing it?")+
  '<div class="opts">'+opts.map(function(o){
    return '<button class="opt" aria-pressed="'+(S.draft.route===o[0])+'" onclick="setD(\'route\',\''+o[0]+'\')">'+
      '<span><span class="ot">'+esc(o[1])+'</span><span class="od">'+esc(o[2])+'</span></span></button>';
  }).join("")+'</div>'+nav("Next", !!S.draft.route);
}

function sArtist(){
  if(S.draft.route==="any"){
    return head("Righto.","We\'ll give it to whoever\'s free first and suits the job. You can still say no when we come back to you.")+
      '<div class="note">Nothing else to pick here. Next question.</div>'+nav("Next", true);
  }
  if(S.draft.route==="help"){
    return head("What sort of thing is it?","Pick what\'s closest. It only decides who we show it to first.")+
      '<div class="ogrid">'+STYLES.map(function(s){
        return '<button class="ocell" aria-pressed="'+(S.draft.styles.indexOf(s)>=0)+'" onclick="toggleD(\'styles\',\''+esc(s)+'\')">'+
          '<span class="ot">'+esc(s)+'</span></button>';
      }).join("")+'</div>'+
      (S.draft.styles.length ? '<div class="note mt">'+esc(suggestLine())+'</div>' : '')+
      nav("Next", S.draft.styles.length>0);
  }
  return head("Pick your tattooist.")+
    '<div class="apick">'+ARTISTS.map(function(a){
      return '<button aria-pressed="'+(S.draft.artist===a.id)+'" onclick="setD(\'artist\',\''+a.id+'\')">'+
        pic(a.pic, a.name+" — portrait")+
        '<span class="pn">'+esc(a.name)+'</span><span class="ps">'+esc(a.does)+'</span></button>';
    }).join("")+'</div>'+
    (S.draft.artist ? '<div class="note mt"><b>'+esc(artist(S.draft.artist).name)+'.</b> '+
      esc(artist(S.draft.artist).does)+' '+(artist(S.draft.artist).years?esc(artist(S.draft.artist).years)+' in.':'')+
      ' If it turns out this isn\'t his sort of thing we\'ll tell you and put it in front of someone here who it is.</div>' : '')+
    nav("Next", !!S.draft.artist);
}
function suggestLine(){
  var s=S.draft.styles;
  var hit=ARTISTS.filter(function(a){return a.tags.some(function(t){return s.indexOf(t)>=0});});
  if(!hit.length) return "We'll work out who's best for it once we read the rest.";
  var names=hit.slice(0,3).map(function(a){return a.name.split(" ")[0]});
  return "That's " + (names.length>1 ? names.slice(0,-1).join(", ")+" or "+names.slice(-1) : names[0]) +
         "'s sort of thing. We'll put it in front of them first.";
}

function sJob(){
  return head("What are we doing?")+
  '<div class="opts">'+JOBS.map(function(j){
    return '<button class="opt" aria-pressed="'+(S.draft.job===j[0])+'" onclick="setD(\'job\',\''+esc(j[0])+'\')">'+
      '<span><span class="ot">'+esc(j[0])+'</span>'+(j[1]?'<span class="od">'+esc(j[1])+'</span>':'')+'</span></button>';
  }).join("")+'</div>'+
  (S.draft.job==="Cover-up"?'<div class="note mt">Cover-ups nearly always need you to come in so we can look at what\'s there. Send it through anyway and we\'ll sort a time.</div>':'')+
  nav("Next", !!S.draft.job);
}

function sIdea(){
  return head("What's the idea?","As much or as little as you like. We draw it up ourselves off what you tell us, so don\'t worry about getting it perfect.")+
  '<textarea id="ideabox" rows="7" placeholder="Peonies down the outside of my thigh, soft shading, nothing too dark..." oninput="S.draft.idea=this.value">'+esc(S.draft.idea)+'</textarea>'+
  nav("Next", true);
}

function sRefs(){
  var t = S.draft.refs.map(function(r,i){
    return '<div class="thumb"><img src="'+r+'" alt=""><button class="x" onclick="rmRef('+i+')">✕</button></div>';
  }).join("");
  return head("Got references? Send them through.","Anything you\'ve saved. We use them as a starting point and draw you something off the back of it — it won\'t come out as a copy. That\'s a good thing by the way.")+
  '<label class="drop" for="reffile">Pick images off your phone<br><span class="lbl" style="display:block;margin-top:7px">or drag them in</span></label>'+
  '<input type="file" id="reffile" accept="image/*" multiple hidden onchange="addRefs(this)">'+
  (t?'<div class="thumbs">'+t+'</div>':'')+
  nav("Next", true, S.draft.refs.length?null:"Haven't got any");
}
window.addRefs = function(inp){
  var fs=[].slice.call(inp.files||[]);
  var left=fs.length; if(!left) return;
  fs.forEach(function(f){
    var fr=new FileReader();
    fr.onload=function(e){ S.draft.refs.push(e.target.result); if(!--left){save();render();} };
    fr.readAsDataURL(f);
  });
};
window.rmRef = function(i){ S.draft.refs.splice(i,1); save(); render(); };

function sSpot(){
  return head("Chuck in a photo of the spot.","Just the bit of you it's going on. It tells us how much room there actually is, what shape it needs to be, and whether there's anything already there we need to work around. Saves you a trip in.")+
  (S.draft.spot?'<div class="thumbs" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))"><div class="thumb" style="aspect-ratio:3/4"><img src="'+S.draft.spot+'" alt=""><button class="x" onclick="S.draft.spot=null;save();render()">✕</button></div></div>'
    :'<label class="drop" for="spotfile">Take one now or pick one</label>'+
     '<input type="file" id="spotfile" accept="image/*" hidden onchange="addSpot(this)">')+
  '<div class="note mt">Only we see it. It goes on the request and nowhere else.</div>'+
  nav("Next", true, S.draft.spot?null:"Skip it");
}
window.addSpot = function(inp){
  var f=(inp.files||[])[0]; if(!f) return;
  var fr=new FileReader(); fr.onload=function(e){S.draft.spot=e.target.result;save();render();};
  fr.readAsDataURL(f);
};

function sPlace(){
  var sided = S.draft.place && SIDED.indexOf(S.draft.place)>=0;
  return head("Where's it going?")+
  '<div class="ogrid">'+PLACES.map(function(p){
    return '<button class="ocell" aria-pressed="'+(S.draft.place===p)+'" onclick="setD(\'place\',\''+esc(p)+'\')">'+
      '<span class="ot">'+esc(p)+'</span></button>';
  }).join("")+'</div>'+
  (sided?'<div class="mt"><p class="lbl" style="margin-bottom:8px">Which side?</p><div class="ogrid" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr))">'+
    ["Left","Right","Both","Not fussed"].map(function(x){
      return '<button class="ocell" aria-pressed="'+(S.draft.side===x)+'" onclick="setD(\'side\',\''+x+'\')"><span class="ot">'+x+'</span></button>';
    }).join("")+'</div></div>':'')+
  nav("Next", !!S.draft.place);
}

function sSize(){
  return head("How big, roughly?","Rough is fine. If it needs to be bigger to hold up, whoever takes it will tell you.")+
  '<div class="opts">'+SIZES.map(function(z){
    return '<button class="opt" aria-pressed="'+(S.draft.size===z[0])+'" onclick="setD(\'size\',\''+esc(z[0])+'\')">'+
      '<span><span class="ot">'+esc(z[0])+'</span><span class="od">'+esc(z[1])+'</span></span></button>';
  }).join("")+'</div>'+nav("Next", !!S.draft.size);
}

function sColour(){
  return head("Black and grey, or colour?")+
  '<div class="ogrid">'+COLOURS.map(function(c){
    return '<button class="ocell" aria-pressed="'+(S.draft.colour===c[0])+'" onclick="setD(\'colour\',\''+esc(c[0])+'\')">'+
      '<span class="ot">'+esc(c[0])+'</span>'+(c[1]?'<span class="od">'+esc(c[1])+'</span>':'')+'</button>';
  }).join("")+'</div>'+nav("Next", !!S.draft.colour);
}

function sBudget(){
  return head("What are you looking to spend?","Not an auction — we price the piece, not the answer you give here. It just means we can tell you straight away if the idea and the number don't line up, instead of three weeks from now.")+
  '<div class="ogrid">'+BUDGETS.map(function(b){
    return '<button class="ocell" aria-pressed="'+(S.draft.budget===b[0])+'" onclick="setD(\'budget\',\''+esc(b[0])+'\')">'+
      '<span class="ot">'+esc(b[0])+'</span>'+(b[1]?'<span class="od">'+esc(b[1])+'</span>':'')+'</button>';
  }).join("")+'</div>'+
  '<div class="note mt">Studio minimum is $150. Half days start at $600, full days at $1000.</div>'+
  nav("Next", !!S.draft.budget);
}

function sWhen(){
  return head("When can you get in?","We're open Tuesday to Saturday, 10 til 5. Pick whatever days generally work.")+
  '<div class="ogrid" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">'+DAYS.map(function(d){
    return '<button class="ocell" aria-pressed="'+(S.draft.days.indexOf(d)>=0)+'" onclick="toggleD(\'days\',\''+d+'\')">'+
      '<span class="ot">'+d+'</span></button>';
  }).join("")+'</div>'+
  '<div class="note mt">Waiting times run anywhere from an hour to six months depending on who you\'re after and how big it is.</div>'+
  nav("Next", S.draft.days.length>0);
}

function sYou(){
  var d=S.draft;
  return head("Who are we talking to?")+
  '<div class="stack">'+
    '<div><p class="lbl" style="margin-bottom:6px">Name</p><input type="text" value="'+esc(d.name)+'" oninput="S.draft.name=this.value" placeholder="First and last"></div>'+
    '<div><p class="lbl" style="margin-bottom:6px">Mobile</p><input type="tel" value="'+esc(d.phone)+'" oninput="S.draft.phone=this.value" placeholder="04.."></div>'+
    '<div><p class="lbl" style="margin-bottom:6px">Email</p><input type="email" value="'+esc(d.email)+'" oninput="S.draft.email=this.value" placeholder="you@..."></div>'+
  '</div>'+
  '<div class="mt"><p class="lbl" style="margin-bottom:8px">Easiest way to get hold of you</p>'+
  '<div class="ogrid" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr))">'+
    ["Text","Call","Email"].map(function(c){
      return '<button class="ocell" aria-pressed="'+(d.contact===c)+'" onclick="setD(\'contact\',\''+c+'\')"><span class="ot">'+c+'</span></button>';
    }).join("")+'</div></div>'+
  '<div class="note mt">You need to be 18 or over with valid ID on the day. No exceptions.</div>'+
  nav("Next", !!(d.name && (d.phone||d.email) && d.contact));
}

function sReview(){
  var d=S.draft;
  var who = d.route==="known" && d.artist ? artist(d.artist).name
          : d.route==="help" ? "Whoever suits it — "+(d.styles.join(", ")||"")
          : "Whoever's free first";
  var rows=[["Tattooist",who,"route"],["What we're doing",d.job,"job"],["The idea",d.idea||"—","idea"],
    ["References",d.refs.length? d.refs.length+" image"+(d.refs.length>1?"s":""):"None","refs"],
    ["Photo of the spot",d.spot?"Sent":"Not sent","spot"],
    ["Where",(d.place||"—")+(d.side?" · "+d.side:""),"place"],
    ["Size",d.size||"—","size"],["Colour",d.colour||"—","colour"],
    ["Budget",d.budget||"—","budget"],["Days that suit",d.days.join(", ")||"—","when"],
    ["You",[d.name,d.phone,d.email].filter(Boolean).join(" · ")||"—","you"],
    ["Contact you by",d.contact||"—","you"]];

  return head("Have a read before you send it.")+
  '<div class="rev">'+rows.map(function(r){
    return '<dl class="revr"><dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd>'+
      '<button class="ed" onclick="jumpTo(\''+r[2]+'\')">Change</button></dl>';
  }).join("")+'</div>'+
  (d.refs.length?'<div class="thumbs mt">'+d.refs.map(function(r){return '<div class="thumb"><img src="'+r+'" alt=""></div>';}).join("")+'</div>':'')+
  '<div class="note mt2"><b>This isn\'t a booking.</b> It\'s a request. Someone has a look, works out how long it needs and offers you times out of their own book. Nothing\'s locked in until you\'ve picked one and left the booking fee.</div>'+
  '<div class="fnav"><button class="back" onclick="stepBack()">Back</button><span class="sp"></span>'+
  '<button class="bk" onclick="sendIt()">Send it through</button></div>';
}
window.sendIt = function(){ go("sent"); };

function vSent(){
  var d=S.draft;
  return '<nav class="snav"><div class="snav-in"><button class="logofall" onclick="go(\'site\')">Westside</button></div></nav>'+
   '<div class="wrap big-ok">'+
    '<h1>Got it.</h1>'+
    '<p class="fhelp mt" style="font-size:18px">'+
      (d.route==="known"&&d.artist ? esc(artist(d.artist).name.split(" ")[0])+"'ll have a look and get back to you."
       : "One of us will have a look and get back to you.")+
      ' If it\'s not right for them we\'ll put it in front of someone here who it does suit — you won\'t have to send it again.</p>'+
    '<div class="ticketrow">'+
      '<div><dt>Reference</dt><dd class="mono">WS-4418</dd></div>'+
      '<div><dt>Sent</dt><dd>Just now</dd></div>'+
      '<div><dt>Back to you</dt><dd>'+nc("Usually a couple of days","response time the studio can hold")+'</dd></div>'+
      '<div><dt>Still to come</dt><dd>Times to pick from, then the booking fee. It\'s not booked until both are done.</dd></div>'+
    '</div>'+
    '<div class="mt2 stack" style="grid-template-columns:auto auto;display:flex;gap:10px;flex-wrap:wrap">'+
      '<button class="bk" onclick="go(\'signin\')">See what lands on Bob\'s screen</button>'+
      '<button class="bk gh" onclick="go(\'site\')">Back to the site</button>'+
    '</div>'+
   '</div>';
}
</script>

<script>
/* ============================ THE BOOK (artist) ============================ */
function vSignin(){
  return '<div class="wrap" style="max-width:420px;padding-top:12vh">'+
    '<h1 style="font-size:44px">The Book</h1>'+
    '<p class="lbl mt">Westside Mermaid Beach</p>'+
    '<div class="stack mt2">'+ARTISTS.map(function(a){
      return '<button class="opt" onclick="signin(\''+a.id+'\')">'+
        '<span style="width:38px;height:38px;overflow:hidden;flex:none;background:var(--blk3)">'+
        (a.pic?'<img src="'+a.pic+'" alt="" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display=\'none\'">':'')+
        '</span><span><span class="ot">'+esc(a.name)+'</span></span>'+
        '<span class="oi">Sign in</span></button>';
    }).join("")+'</div>'+
    '<button class="skip mt2" onclick="go(\'counter\')">Or open the counter</button>'+
  '</div>';
}
window.signin = function(id){ S.me=id; S.who="artist"; go("desk"); };

function bookTop(){
  var a=artist(S.me);
  return '<div class="bk-top"><div class="bk-top-in">'+
    '<button class="logofall" style="font-size:15px" onclick="go(\'desk\')">Westside</button>'+
    '<span class="lbl">The Book</span>'+
    '<div class="who"><span class="lbl">'+esc(a.name)+'</span>'+
    '<span class="av">'+(a.pic?'<img src="'+a.pic+'" alt="" onerror="this.style.display=\'none\'">':'')+'</span>'+
    '<button class="skip" onclick="go(\'signin\')">Out</button></div>'+
  '</div></div>';
}
function bookTabs(active){
  var t=[["desk","Requests",mine().filter(function(r){return r.status==="new"}).length],
         ["cal","My week",0],["done","Booked in",count("booked")]];
  return '<div class="bk-tabs"><div class="wrap" style="display:flex">'+t.map(function(x){
    return '<button class="'+(active===x[0]?"on":"")+'" onclick="go(\''+x[0]+'\')">'+x[1]+
      (x[2]?'<span class="ct">'+x[2]+'</span>':'')+'</button>';
  }).join("")+'</div></div>';
}

function vDesk(){
  var a=artist(S.me);
  var first=a.name.split(" ")[0];
  var list=mine();
  var newOnes=list.filter(function(r){return r.status==="new"});
  var waitMe=list.filter(function(r){return r.status==="waiting-me"});
  var waitThem=list.filter(function(r){return r.status==="waiting-them"||r.status==="offered"});
  var fee=list.filter(function(r){return r.status==="fee"});
  var booked=list.filter(function(r){return r.status==="booked"});

  function card(r){
    var st=STATUS[r.status];
    var thumbs=(r.refs||[]).slice(0,4);
    var late = r.waited && r.waited>=4;
    return '<button class="qc '+(r.mine?"mine":"")+(late?" late":"")+'" onclick="openReq(\''+r.id+'\')">'+
      '<span class="qthumbs">'+(thumbs.length?thumbs.slice(0,4).map(function(t){return pic(t,"Reference");}).join("")
        : '<span class="iw" style="aspect-ratio:1">'+needCard("","No references sent")+'</span>')+'</span>'+
      '<span><h3>'+esc(r.title)+'</h3>'+
        '<span class="meta">'+esc(r.cust)+(r.first?' · first tattoo':'')+'<br>'+
        esc(r.place)+(r.side?' · '+esc(r.side):'')+' · <b>'+esc(r.size)+'</b> · '+esc(r.colour)+'<br>'+
        esc(r.budget)+' · '+esc(r.days)+
        (r.project?'<br><b>Session '+r.sessionNo+' of '+r.sessions+'</b>':'')+
        '</span></span>'+
      '<span class="rt"><span class="tag '+st.cls+'">'+st.t+'</span>'+
        '<span class="ago '+(late?"late":"")+'">'+(r.waited? r.waited+" days":"today")+'</span></span>'+
    '</button>';
  }

  function group(title, arr){
    if(!arr.length) return '';
    return '<div class="mt2"><p class="lbl" style="margin-bottom:10px">'+esc(title)+'</p>'+
      '<div class="q-list">'+arr.map(card).join("")+'</div></div>';
  }

  return bookTop()+bookTabs("desk")+'<div class="wrap">'+
    '<div class="hello"><h2>Morning, '+esc(first)+'.</h2>'+
      '<dl class="tally">'+
        '<div><dt>New</dt><dd>'+newOnes.length+'</dd></div>'+
        '<div><dt>Waiting on me</dt><dd>'+waitMe.length+'</dd></div>'+
        '<div><dt>Waiting on them</dt><dd class="'+(waitThem.some(function(r){return r.waited>=4})?"hot":"")+'">'+waitThem.length+'</dd></div>'+
        '<div><dt>Fee owing</dt><dd class="'+(fee.length?"hot":"")+'">'+fee.length+'</dd></div>'+
        '<div><dt>Booked in</dt><dd>'+booked.length+'</dd></div>'+
      '</dl></div>'+
    payStrip(a)+
    group("New", newOnes)+
    group("Waiting on me", waitMe)+
    group("Waiting on them", waitThem)+
    group("Booking fee owing", fee)+
    group("Booked in", booked)+
    '<div style="height:50px"></div>'+
  '</div>';
}
window.openReq = function(id){ S.openReq=id; go("req"); };

function vReq(){
  var r=reqById(S.openReq); if(!r) return vDesk();
  var a=artist(S.me);
  var refs=(r.refs||[]).map(function(x){return pic(x,"Reference from the client");}).join("");

  return bookTop()+'<div class="wrap">'+
    '<div style="display:flex;gap:14px;align-items:center;padding:18px 0">'+
      '<button class="skip" onclick="go(\'desk\')">← Back</button>'+
      '<span class="lbl mono">'+esc(r.id)+'</span>'+
      '<span class="tag '+STATUS[r.status].cls+'">'+STATUS[r.status].t+'</span>'+
    '</div>'+
    '<div class="det">'+
      '<div><div class="pane">'+
        '<h3>'+esc(r.title)+'</h3>'+
        '<p class="quote">'+esc(r.idea)+'</p>'+
        '<dl class="facts">'+
          '<div><dt>Where</dt><dd>'+esc(r.place)+(r.side?' · '+esc(r.side):'')+'</dd></div>'+
          '<div><dt>Size</dt><dd>'+esc(r.size)+'</dd></div>'+
          '<div><dt>Colour</dt><dd>'+esc(r.colour)+'</dd></div>'+
          '<div><dt>Job</dt><dd>'+esc(r.job)+'</dd></div>'+
          '<div><dt>Budget</dt><dd>'+esc(r.budget)+'</dd></div>'+
          '<div><dt>Free</dt><dd>'+esc(r.days)+'</dd></div>'+
        '</dl>'+
      '</div>'+
      (refs?'<div class="big">'+refs+'</div>':'')+
      (r.spot?'<div class="spot">'+pic(r.spot,"Photo of the area")+
        '<div><p class="lbl">The spot</p><p style="color:var(--mid);font-size:14.5px;margin-top:8px">'+
        esc(r.place)+(r.side?', '+esc(r.side).toLowerCase():'')+'. Sent by the client with the request.</p></div></div>':'')+
      '<div class="pane mt" style="margin-top:3px"><h3>Thread</h3>'+thread(r)+
        '<div class="mt"><textarea rows="3" id="replybox" placeholder="Type a reply..."></textarea>'+
        '<div class="fnav" style="margin-top:10px;padding-top:0;border:none"><span class="sp"></span>'+
        '<button class="bk gh" onclick="sendMsg(\''+r.id+'\')">Send</button></div></div>'+
      '</div></div>'+

      '<div><div class="pane">'+
        '<h3>'+esc(r.cust)+'</h3>'+
        '<dl class="facts" style="grid-template-columns:1fr">'+
          '<div><dt>Mobile</dt><dd>'+esc(r.phone)+'</dd></div>'+
          '<div><dt>Email</dt><dd style="font-size:13.5px">'+esc(r.email)+'</dd></div>'+
          '<div><dt>Prefers</dt><dd>'+esc(r.contact)+'</dd></div>'+
          (r.first?'<div><dt>Note</dt><dd>First tattoo</dd></div>':'')+
        '</dl></div>'+
        '<div class="acts">'+
          (r.status==="booked"
            ? '<div class="act"><span><span class="at">Booked</span><span class="ad">'+esc(r.slot||"")+'</span></span></div>'
            : '<button class="act main" onclick="go(\'approve\')"><span><span class="at">I\'ll take it</span>'+
              '<span class="ad">Say how long it needs and offer times</span></span></button>')+
          '<button class="act" onclick="askQ(\''+r.id+'\')"><span><span class="at">Ask something</span>'+
            '<span class="ad">Need more before you can call it</span></span></button>'+
          (["fee","booked"].indexOf(r.status)>=0
            ? '<button class="act" onclick="go(\'move\')"><span><span class="at">Hand it to someone else</span>'+
              '<span class="ad">Fee\'s already paid to you — this sorts that out</span></span></button>'
            : '<button class="act" onclick="passOn(\''+r.id+'\')"><span><span class="at">Send it to someone else</span>'+
              '<span class="ad">Stays in the shop, client doesn\'t start again</span></span></button>')+
          '<button class="act" onclick="notMine(\''+r.id+'\')"><span><span class="at">Not for me</span>'+
            '<span class="ad">Goes back to the counter to reassign</span></span></button>'+
        '</div>'+
        (r.project?'<div class="pane mt" style="margin-top:3px"><p class="lbl">Project</p>'+
          '<p style="margin:8px 0 0;color:var(--bone)">Session '+r.sessionNo+' of '+r.sessions+'. Booking fee held until the last one.</p></div>':'')+
      '</div>'+
    '</div><div style="height:50px"></div></div>';
}

function thread(r){
  var msgs=r.thread||[];
  if(!msgs.length) return '<p style="color:var(--dim);font-size:14.5px;margin:0">Nothing yet.</p>';
  return '<div class="thr">'+msgs.map(function(m){
    if(m.sys) return '<div class="msg sys">'+esc(m.note||("Request came in · "+m.t))+'</div>';
    var us = m.who==="Westside" || ARTISTS.some(function(a){return a.name.split(" ")[0]===m.who});
    return '<div class="msg '+(us?"us":"them")+'"><div class="mw">'+esc(m.who)+'</div>'+esc(m.t)+'</div>';
  }).join("")+'</div>';
}
window.sendMsg = function(id){
  var box=document.getElementById("replybox"); if(!box||!box.value.trim())return;
  var r=reqById(id); r.thread=r.thread||[];
  r.thread.push({who:artist(S.me).name.split(" ")[0], t:box.value.trim()});
  r.status="waiting-them"; r.waited=0; save(); render();
};
window.askQ = function(id){
  var r=reqById(id); r.thread=r.thread||[];
  r.thread.push({who:artist(S.me).name.split(" ")[0],
    t:"Had a look. Before I can say how long it needs — would you go a bit bigger than that? At 20cm with that much detail in it, the shading'll close up on you in ten years. 25-ish would hold. You right with that?"});
  r.status="waiting-them"; r.waited=0; save(); render();
};
window.passOn = function(id){
  var r=reqById(id);
  var others=ARTISTS.filter(function(a){return a.id!==S.me});
  var to=others[0];
  r.artist=to.id; r.mine=false; r.status="new";
  r.thread=r.thread||[];
  r.thread.push({who:"Westside", sys:true, note:"Sent to "+to.name+" — more his thing. Client not told to start again."});
  save(); go("desk");
};
window.notMine = function(id){
  var r=reqById(id); r.artist=null; r.mine=false; r.unassigned=true; r.status="new";
  r.thread=r.thread||[]; r.thread.push({who:"Westside", sys:true, note:"Passed back to the counter to reassign."});
  save(); go("desk");
};

/* ---------- handing a paid job to another artist ---------- */
function vMove(){
  var r=reqById(S.openReq); if(!r) return vDesk();
  var from=artist(r.artist);
  var to=S.moveTo?artist(S.moveTo):null;
  var others=ARTISTS.filter(function(x){return x.id!==r.artist});
  return bookTop()+'<div class="wrap" style="max-width:760px">'+
    '<div style="padding:18px 0"><button class="skip" onclick="go(\'req\')">← Back</button>'+
    '<span class="lbl mono" style="margin-left:14px">'+esc(r.id)+'</span></div>'+
    '<h1 style="font-size:clamp(32px,5.5vw,52px)">Handing this on</h1>'+
    '<p class="fhelp mt">'+esc(r.cust)+' already paid the $100 into your account. Because everyone here is their own business, '+
    'it can\'t just slide across — it gets refunded from you and taken again by whoever picks it up. '+
    esc(r.cust.split(" ")[0])+' has to agree first, and the time comes out of your book.</p>'+
    '<p class="lbl mt2" style="margin-bottom:10px">Who\'s taking it</p>'+
    '<div class="apick">'+others.map(function(x){
      return '<button aria-pressed="'+(S.moveTo===x.id)+'" onclick="S.moveTo=\''+x.id+'\';save();render()">'+
        pic(x.pic, x.name+" — portrait")+
        '<span class="pn">'+esc(x.name)+'</span>'+
        '<span class="ps">'+(x.pay==="active"?"Payouts on":"<span style=\'color:var(--flag)\'>Payouts not set up</span>")+'</span></button>';
    }).join("")+'</div>'+
    (to?'<div class="settle mt">'+
      '<div class="sr"><span>Refund from '+esc(from.name)+'</span><span class="mono">−$100.00</span></div>'+
      '<div class="sr"><span>Slot released from your book</span><span class="mono">'+esc(r.slot||"—")+'</span></div>'+
      '<div class="sr tot"><span>'+esc(to.name)+' re-quotes and takes a new fee</span><span class="mono">$100.00</span></div>'+
    '</div>'+
    (to.pay!=="active"
      ? '<div class="note" style="border-left-color:var(--flag)"><b>'+esc(to.name.split(" ")[0])+' can\'t take a fee yet.</b> Their payouts aren\'t set up. Send it over anyway and they\'ll sort it before quoting.</div>'
      : '')
    :'')+
    '<div class="note mt">'+esc(r.cust.split(" ")[0])+' gets told what\'s happening and why, and can say no. Nobody has to send the request in again.</div>'+
    '<div class="fnav"><button class="back" onclick="go(\'req\')">Leave it with me</button><span class="sp"></span>'+
    '<button class="bk" onclick="doMove()" '+(to?'':'disabled style="opacity:.35;cursor:not-allowed"')+'>Refund and hand over</button></div>'+
    '<div style="height:50px"></div></div>';
}
window.doMove=function(){
  var r=reqById(S.openReq), to=artist(S.moveTo), from=artist(r.artist);
  r.thread=r.thread||[];
  r.thread.push({who:"Westside", sys:true,
    note:"Fee refunded from "+from.name+" · "+(r.slot||"slot")+" released · handed to "+to.name});
  r.thread.push({who:from.name.split(" ")[0],
    t:"Sorry mate, I'm not going to get to this when you need it. "+to.name.split(" ")[0]+"'s better for it anyway. Your $100's back on your card today — "+to.name.split(" ")[0]+" will come back with a time and take it again. Nothing for you to redo."});
  r.artist=to.id; r.mine=(to.id===S.me); r.status="new"; r.slot=null; r.offers=null; r.waited=0;
  S.moveTo=null; save(); go("desk");
};

/* ---------- approve + offer times ---------- */
var OFFERS=[
  {d:"Thu 25 Sep", t:"10:00am", note:""},
  {d:"Fri 26 Sep", t:"12:30pm", note:""},
  {d:"Tue 30 Sep", t:"10:00am", note:""},
  {d:"Fri 3 Oct",  t:"10:00am", note:""},
  {d:"Sat 4 Oct",  t:"1:00pm",  note:""}
];
S.offerPick = S.offerPick || [];
function vApprove(){
  var r=reqById(S.openReq); if(!r) return vDesk();
  var hrs=S.approveHrs||4;
  var multi=S.approveMulti||false;
  return bookTop()+'<div class="wrap" style="max-width:860px">'+
    '<div style="display:flex;gap:14px;align-items:center;padding:18px 0">'+
      '<button class="skip" onclick="go(\'req\')">← Back</button><span class="lbl mono">'+esc(r.id)+'</span></div>'+
    '<h1 style="font-size:clamp(32px,5.5vw,52px)">How long does it need?</h1>'+
    '<p class="fhelp mt">Your call. This is what works out which of your own gaps are big enough to offer.</p>'+
    '<div class="ogrid" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr))">'+
      [2,3,4,5,6].map(function(h){
        return '<button class="ocell" aria-pressed="'+(hrs===h)+'" onclick="S.approveHrs='+h+';save();render()">'+
          '<span class="ot">'+h+' hours</span></button>';
      }).join("")+'</div>'+
    '<div class="mt"><p class="lbl" style="margin-bottom:8px">One sitting or more than one?</p>'+
    '<div class="ogrid" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr))">'+
      '<button class="ocell" aria-pressed="'+(!multi)+'" onclick="S.approveMulti=false;save();render()"><span class="ot">One session</span></button>'+
      '<button class="ocell" aria-pressed="'+(multi)+'" onclick="S.approveMulti=true;save();render()"><span class="ot">More than one</span><span class="od">Keeps them grouped as one job. Fee held til the last.</span></button>'+
    '</div></div>'+
    '<div class="hr"></div>'+
    '<h2 style="font-size:clamp(26px,4vw,40px)">Gaps in your book that fit</h2>'+
    '<p class="fhelp mt">'+hrs+'-hour gaps, Tuesday to Saturday, from your own availability. Pick the ones you\'re happy to offer.</p>'+
    '<div class="slots">'+OFFERS.map(function(o,i){
      return '<button class="slot" aria-pressed="'+(S.offerPick.indexOf(i)>=0)+'" onclick="togOffer('+i+')">'+
        '<span class="sd">'+esc(o.d)+'</span><span class="sh">'+esc(o.t)+' · '+hrs+' hrs</span></button>';
    }).join("")+'</div>'+
    '<div class="note mt">Nothing comes out of your book yet. These get sent over and the first one they take is the one that sticks — the rest stay free.</div>'+
    (artist(S.me).pay!=="active"
      ? '<div class="note" style="border-left-color:var(--flag)"><b>You can\'t take a booking fee yet.</b> '+esc(PAYTXT[artist(S.me).pay][1])+' It\'s your account, not the shop\'s — the fee goes straight to you.</div>'
      : '')+
    '<div class="fnav"><button class="back" onclick="go(\'req\')">Back</button><span class="sp"></span>'+
    (artist(S.me).pay==="active"
      ? '<button class="bk" onclick="offerThem()" '+(S.offerPick.length?'':'disabled style="opacity:.35;cursor:not-allowed"')+'>Send '+(S.offerPick.length||'')+' time'+(S.offerPick.length===1?'':'s')+'</button>'
      : '<button class="bk" onclick="go(\'payouts\')">Set up payouts first</button>')+
    '</div>'+
    '<div style="height:50px"></div></div>';
}
window.togOffer=function(i){var a=S.offerPick,j=a.indexOf(i);if(j<0)a.push(i);else a.splice(j,1);save();render();};
window.offerThem=function(){
  var r=reqById(S.openReq);
  r.status="offered"; r.hours=S.approveHrs||4; r.sessions=S.approveMulti?5:1;
  r.offers=S.offerPick.map(function(i){return OFFERS[i]});
  r.thread=r.thread||[];
  r.thread.push({who:artist(S.me).name.split(" ")[0],
    t:"Sweet, I'll take it. I'd put "+(S.approveHrs||4)+" hours on it"+(S.approveMulti?" per sitting, and it'll want a few sittings":"")+". Here's what I've got open — grab whichever suits."});
  save(); go("offered");
};

function vPayouts(){
  var a=artist(S.me);
  var steps=[
    ["Who you are","Legal name, date of birth, address. Same as your ABN."],
    ["Your business","ABN and what you do. Sole trader is fine."],
    ["Where it lands","BSB and account number. Yours, not the shop's."]
  ];
  var done=S.payStep||0;
  return bookTop()+'<div class="wrap" style="max-width:640px">'+
    '<div style="padding:18px 0"><button class="skip" onclick="go(\'desk\')">← Back</button></div>'+
    '<h1 style="font-size:clamp(34px,6vw,58px)">Getting paid</h1>'+
    '<p class="fhelp mt">You rent your chair, so booking fees for your work are yours. They go from the client straight into your account — the shop never holds them and can\'t see your balance.</p>'+
    '<div class="stack mt">'+steps.map(function(st,i){
      var state = i<done ? "done" : (i===done ? "now" : "todo");
      return '<div class="opt" style="cursor:default;'+(state==="todo"?"opacity:.4":"")+'">'+
        '<span class="mono" style="width:20px;color:'+(state==="done"?"var(--wht)":"var(--dim)")+'">'+(state==="done"?"✓":(i+1))+'</span>'+
        '<span><span class="ot">'+esc(st[0])+'</span><span class="od">'+esc(st[1])+'</span></span>'+
        (state==="now"?'<span class="oi">Now</span>':'')+
      '</div>';
    }).join("")+'</div>'+
    '<div class="note mt2">Takes about five minutes on your phone. Handled by Stripe, not by us — we never see your bank details. '+
    'If you leave Westside the account stays yours.</div>'+
    '<div class="note"><b>Fees.</b> 1.7% + 30c per booking fee, out of your settlement. On a $100 fee that\'s about $2. '+
    nc("Bob to decide whether artists wear that or the shop covers it","who absorbs the processing fee")+'</div>'+
    '<div class="fnav"><button class="back" onclick="go(\'desk\')">Later</button><span class="sp"></span>'+
    (done<3
      ? '<button class="bk" onclick="S.payStep='+(done+1)+';save();render()">Continue</button>'
      : '<button class="bk" onclick="finishPayouts()">Done — turn payouts on</button>')+
    '</div>'+
    '<div class="note" style="margin-top:26px;border-left-color:var(--ln2)"><b>Guest artists.</b> Nobody sets this up for a two-week spot. '+
    'Guest bookings keep going through the shop on PayID like they do now.</div>'+
    '<div style="height:50px"></div></div>';
}
window.finishPayouts=function(){
  var a=artist(S.me); a.pay="active"; PAYSTATUS[a.id]="active"; S.payStep=0; save(); go("approve");
};

function vOffered(){
  var r=reqById(S.openReq);
  return bookTop()+'<div class="wrap" style="max-width:720px;padding-top:12vh">'+
    '<h1 style="font-size:clamp(40px,8vw,84px)">Sent.</h1>'+
    '<p class="fhelp mt" style="font-size:18px">'+esc(r.cust)+' has '+(r.offers||[]).length+' times to pick from. '+
    'When one\'s taken and the fee\'s in, it lands in your book and the others stay open.</p>'+
    '<div class="mt2" style="display:flex;gap:10px;flex-wrap:wrap">'+
      '<button class="bk" onclick="go(\'pick\')">See what '+esc(r.cust.split(" ")[0])+' gets</button>'+
      '<button class="bk gh" onclick="go(\'desk\')">Back to the book</button>'+
    '</div></div>';
}
</script>

<script>
/* ============================ CUSTOMER PICKS + PAYS ============================ */
function vPick(){
  var r=reqById(S.openReq)||S.reqs[0];
  var a=artist(r.artist)||artist("bob");
  var offers=r.offers||OFFERS.slice(0,3);
  return '<nav class="snav"><div class="snav-in"><button class="logofall" onclick="go(\'site\')">Westside</button>'+
    '<div class="links"><span class="lbl">'+esc(r.id)+'</span></div></div></nav>'+
    '<div class="wrap" style="max-width:760px;padding-block:clamp(34px,6vw,70px)">'+
    '<h1 class="fq">'+esc(a.name.split(" ")[0])+'\'s in.</h1>'+
    '<p class="fhelp">He\'s put '+(r.hours||4)+' hours on it'+((r.sessions||1)>1?', across a few sittings':'')+
    '. Pick a time that works and we\'ll hold it.</p>'+
    '<div class="msg them" style="max-width:100%;margin-bottom:22px"><div class="mw">'+esc(a.name.split(" ")[0])+'</div>'+
      esc(((r.thread||[]).slice(-1)[0]||{}).t || "")+'</div>'+
    '<div class="slots">'+offers.map(function(o,i){
      return '<button class="slot" aria-pressed="'+(S.pickSlot===i)+'" onclick="S.pickSlot='+i+';save();render()">'+
        '<span class="sd">'+esc(o.d)+'</span><span class="sh">'+esc(o.t)+' · '+(r.hours||4)+' hrs</span></button>';
    }).join("")+'</div>'+
    '<div class="note mt">Booking fee is $100 and comes off the tattoo'+((r.sessions||1)>1?", held until the last sitting":"")+
    '. Nothing\'s held until it\'s paid.</div>'+
    '<div class="fnav"><span class="sp"></span><button class="bk" onclick="go(\'pay\')" '+
      (S.pickSlot!=null?'':'disabled style="opacity:.35;cursor:not-allowed"')+'>Take this one</button></div>'+
    '</div>';
}
function vPay(){
  var r=reqById(S.openReq)||S.reqs[0];
  var o=(r.offers||OFFERS)[S.pickSlot||0];
  return '<nav class="snav"><div class="snav-in"><button class="logofall" onclick="go(\'site\')">Westside</button></div></nav>'+
    '<div class="wrap" style="max-width:560px;padding-block:clamp(34px,6vw,70px)">'+
    '<h1 class="fq">Booking fee</h1>'+
    '<p class="fhelp">$100. Comes off the tattoo. We\'ll hold '+esc(o.d)+' once it\'s through.</p>'+
    '<div class="ticketrow" style="margin-top:0">'+
      '<div><dt>When</dt><dd>'+esc(o.d)+', '+esc(o.t)+'</dd></div>'+
      '<div><dt>How long</dt><dd>'+(r.hours||4)+' hours</dd></div>'+
      '<div><dt>Fee</dt><dd>$100</dd></div>'+
      '<div><dt>On the day</dt><dd>Balance is paid then. Cash or PayID.</dd></div>'+
    '</div>'+
    '<div class="settle mt">'+
      '<div class="sr"><span>Booking fee</span><span class="mono">$100.00</span></div>'+
      '<div class="sr"><span>Card fee (1.7% + 30c)</span><span class="mono">−$2.00</span></div>'+
      '<div class="sr tot"><span>To '+esc((artist(r.artist)||{name:"the artist"}).name)+'</span><span class="mono">$98.00</span></div>'+
      '<div class="sr"><span>To Westside</span><span class="mono">$0.00</span></div>'+
    '</div>'+
    '<div class="note mt">'+esc((artist(r.artist)||{name:"The artist"}).name)+' rents their chair here, so this is paid to them, not to the shop. '+
    'Westside doesn\'t hold it and can\'t spend it.</div>'+
    '<div class="note">Demo only — no payment is taken. Live this is a Stripe Checkout link.</div>'+
    '<div class="fnav"><span class="sp"></span><button class="bk" onclick="payIt()">Pay $100</button></div></div>';
}
window.payIt=function(){
  var r=reqById(S.openReq)||S.reqs[0];
  var o=(r.offers||OFFERS)[S.pickSlot||0];
  r.status="booked"; r.slot=o.d+", "+o.t; r.waited=0;
  r.thread=r.thread||[];
  r.thread.push({who:r.cust.split(" ")[0], t:"Taken "+o.d+". Fee's paid."});
  r.thread.push({who:"Westside", sys:true, note:"Booked · "+o.d+" "+o.t+" · fee received · in "+(artist(r.artist)||{name:"the"}).name.split(" ")[0]+"'s book"});
  save(); go("confirmed");
};
function vConfirmed(){
  var r=reqById(S.openReq)||S.reqs[0];
  var a=artist(r.artist)||artist("bob");
  return '<nav class="snav"><div class="snav-in"><button class="logofall" onclick="go(\'site\')">Westside</button></div></nav>'+
    '<div class="wrap big-ok stuck" style="max-width:760px">'+
    stk("betty","stick stick-win")+
    '<h1>You\'re in.</h1>'+
    '<div class="ticketrow">'+
      '<div><dt>When</dt><dd>'+esc(r.slot)+'</dd></div>'+
      '<div><dt>Who</dt><dd>'+esc(a.name)+'</dd></div>'+
      '<div><dt>How long</dt><dd>'+(r.hours||4)+' hours</dd></div>'+
      '<div><dt>Where</dt><dd>Shop 6/2478 Gold Coast Highway, Mermaid Beach</dd></div>'+
      '<div><dt>Bring</dt><dd>Photo ID. Eat properly beforehand and have something sugary on you.</dd></div>'+
      '<div><dt>Fee paid to</dt><dd>'+esc(a.name)+' · $100 · comes off the tattoo</dd></div>'+
      '<div><dt>Moving it</dt><dd>'+nc("48 hours notice or the fee goes","current policy is non-refundable at 48hrs — worth reconsidering")+'</dd></div>'+
    '</div>'+
    '<div class="mt2" style="display:flex;gap:10px;flex-wrap:wrap">'+
      '<button class="bk" onclick="go(\'cal\')">See it land in '+esc(a.name.split(" ")[0])+'\'s week</button>'+
      '<button class="bk gh" onclick="go(\'site\')">Done</button></div>'+
    '</div>';
}
</script>

<script>
/* ============================ CALENDAR ============================ */
var WEEK=[["Tue","23 Sep","10–5"],["Wed","24 Sep","10–5"],["Thu","25 Sep","10–5"],
          ["Fri","26 Sep","10–5"],["Sat","27 Sep","10–4"],["Sun","28 Sep",""],["Mon","29 Sep",""]];
function vCal(){
  var booked=S.reqs.filter(function(r){return r.status==="booked"&&r.artist===S.me});
  var newBook=booked.filter(function(r){return r.slot&&/25 Sep|26 Sep|30 Sep|3 Oct|4 Oct/.test(r.slot)})[0];
  function evs(dayLabel){
    var out=[];
    if(dayLabel==="Wed") out.push('<span class="ev blk">Drawing — no clients</span>');
    if(dayLabel==="Tue") out.push('<span class="ev bk">10:00 Marco · sleeve s2 · 6h</span>');
    if(dayLabel==="Fri") out.push('<span class="ev bk">10:00 walk-in slot held</span>');
    if(newBook && newBook.slot.indexOf("Thu")===0 && dayLabel==="Thu")
      out.push('<span class="ev new">'+esc(newBook.slot.split(", ")[1])+' '+esc(newBook.cust)+' · '+newBook.hours+'h</span>');
    if(newBook && newBook.slot.indexOf("Fri")===0 && dayLabel==="Fri")
      out.push('<span class="ev new">'+esc(newBook.slot.split(", ")[1])+' '+esc(newBook.cust)+' · '+newBook.hours+'h</span>');
    return out.join("");
  }
  return bookTop()+bookTabs("cal")+'<div class="wrap">'+
    '<div class="hello"><h2>My week</h2>'+
    '<p style="color:var(--mid);margin:10px 0 0;max-width:56ch">Your hours, your days off, your drawing time. Nothing drops into this without you putting it there.</p></div>'+
    '<div class="cal"><div class="calhead">'+
      '<span class="lbl">23 – 29 September</span><span class="sp" style="flex:1"></span>'+
      '<button class="dbtn on">Week</button><button class="dbtn">Day</button><button class="dbtn">Month</button>'+
      '<button class="dbtn" onclick="alert(\'Demo: this is where you\\\'d set your hours or block time out.\')">Set my hours</button>'+
    '</div>'+
    '<div class="calgrid">'+WEEK.map(function(d){
      var off=!d[2];
      return '<div class="cald '+(off?"off":"")+'">'+
        '<span class="dn"><b>'+d[0]+'</b> '+d[1]+'</span>'+
        '<span class="hrs">'+(off?"Closed":d[2])+'</span>'+evs(d[0])+
      '</div>';
    }).join("")+'</div>'+
    '<div class="calkey"><span class="bk">Booked</span><span>Blocked out</span><span class="new">Just booked</span></div>'+
    '</div>'+
    '<div class="note">Set your own hours per day, block out leave, drawing time, guest spots. The system only ever offers gaps that sit inside them and are long enough for the job.</div>'+
    '<div style="height:50px"></div></div>';
}
function vDone(){
  var booked=S.reqs.filter(function(r){return r.status==="booked"&&r.artist===S.me});
  return bookTop()+bookTabs("done")+'<div class="wrap">'+
    '<div class="hello"><h2>Booked in</h2></div>'+
    '<div class="q-list">'+(booked.length?booked.map(function(r){
      return '<button class="qc mine" onclick="openReq(\''+r.id+'\')">'+
        '<span class="qthumbs">'+((r.refs||[]).length?pic(r.refs[0],"Reference"):'<span class="iw" style="aspect-ratio:1">'+needCard("","No reference")+'</span>')+'</span>'+
        '<span><h3>'+esc(r.title)+'</h3><span class="meta">'+esc(r.cust)+'<br><b>'+esc(r.slot||"")+'</b> · '+(r.hours||"")+'h'+
        (r.project?' · session '+r.sessionNo+' of '+r.sessions:'')+'</span></span>'+
        '<span class="rt"><span class="tag">Booked</span></span></button>';
    }).join(""):'<p style="color:var(--dim)">Nothing yet.</p>')+'</div><div style="height:50px"></div></div>';
}
</script>

<script>
/* ============================ THE COUNTER (studio) ============================ */
function vCounter(){
  var all=S.reqs;
  var g={"new":[],"waiting-me":[],"waiting-them":[],"offered":[],"fee":[],"booked":[],"passed":[]};
  all.forEach(function(r){ (g[r.status]||g["new"]).push(r); });
  var unassigned=all.filter(function(r){return !r.artist});
  var filt=S.counterFilter||"all";
  var shown = filt==="all" ? all : all.filter(function(r){return r.status===filt});

  var pills=[["new","New"],["waiting-me","With artists"],["waiting-them","Waiting on client"],
             ["fee","Fee owing"],["booked","Booked"],["passed","Closed"]];

  return '<div class="bk-top"><div class="bk-top-in">'+
      '<button class="logofall" style="font-size:15px" onclick="go(\'site\')">Westside</button>'+
      '<span class="lbl">The Counter</span>'+
      '<div class="who"><button class="skip" onclick="go(\'signin\')">The Book</button></div>'+
    '</div></div>'+
    '<div class="wrap">'+
    '<div class="hello"><h2>What\'s in</h2>'+
    (unassigned.length?'<p style="color:var(--flag);margin:10px 0 0;font-family:var(--m);font-size:12px">'+
      unassigned.length+' not with anyone yet</p>':'')+'</div>'+
    '<div class="pipe">'+
      '<button class="'+(filt==="all"?"on":"")+'" onclick="S.counterFilter=\'all\';save();render()">'+
        '<dt>Everything</dt><dd>'+all.length+'</dd></button>'+
      pills.map(function(p){
        var n=g[p[0]].length;
        return '<button class="'+(filt===p[0]?"on":"")+'" onclick="S.counterFilter=\''+p[0]+'\';save();render()">'+
          '<dt>'+p[1]+'</dt><dd class="'+((p[0]==="fee"||p[0]==="new")&&n?"hot":"")+'">'+n+'</dd></button>';
      }).join("")+'</div>'+

    '<div class="tscroll"><table class="tbl"><thead><tr>'+
      '<th>Ref</th><th>Client</th><th>Job</th><th>With</th><th>Status</th><th>Waiting</th><th></th>'+
    '</tr></thead><tbody>'+shown.map(function(r){
      var late=r.waited&&r.waited>=4;
      return '<tr><td class="mono" style="font-size:12px">'+esc(r.id)+'</td>'+
        '<td>'+esc(r.cust)+'</td>'+
        '<td style="max-width:260px">'+esc(r.title)+(r.project?' <span class="pill">'+r.sessions+' sessions</span>':'')+'</td>'+
        '<td><select class="sel" onchange="assign(\''+r.id+'\',this.value)">'+
          '<option value="">— nobody —</option>'+
          ARTISTS.map(function(a){return '<option value="'+a.id+'"'+(r.artist===a.id?' selected':'')+'>'+esc(a.name)+'</option>';}).join("")+
        '</select></td>'+
        '<td><span class="tag '+STATUS[r.status].cls+'">'+STATUS[r.status].t+'</span></td>'+
        '<td class="mono" style="font-size:12px;'+(late?'color:var(--flag)':'')+'">'+(r.waited?r.waited+" days":"today")+'</td>'+
        '<td><button class="skip" onclick="peek(\''+r.id+'\')">Open</button></td></tr>';
    }).join("")+'</tbody></table></div>'+

    '<div class="mt2"><p class="lbl" style="margin-bottom:10px">Who can take a booking fee</p>'+
    '<div class="tscroll"><table class="tbl"><thead><tr><th>Tattooist</th><th>Payouts</th><th>Booking fees go to</th></tr></thead><tbody>'+
    ARTISTS.map(function(a){
      var t=a.pay==="active"?["On",""]:a.pay==="pending"?["Being checked",""]:["Not set up",""];
      return '<tr><td>'+esc(a.name)+'</td>'+
        '<td><span class="tag '+(a.pay==="active"?"":"r")+'">'+t[0]+'</span></td>'+
        '<td style="color:var(--mid)">'+(a.pay==="active"?esc(a.name)+"'s own account":"Can't take one yet")+'</td></tr>';
    }).join("")+'</tbody></table></div>'+
    '<div class="note">Everyone here rents their chair, so fees settle to each tattooist directly. The shop never holds client money. '+
    'Guest artists stay on PayID through the counter.</div></div>'+
    '<div class="note mt">Anything sitting more than three days shows red. That\'s the whole point of this screen — not the numbers, the things going quiet.</div>'+
    '<div style="height:50px"></div></div>';
}
window.assign=function(id,who){
  var r=reqById(id); r.artist=who||null; r.mine=(who===S.me); r.unassigned=!who;
  if(who) r.status="new"; save(); render();
};
window.peek=function(id){ var r=reqById(id); if(r.artist) S.me=r.artist; S.openReq=id; go("req"); };
</script>

<script>
/* ============================ ROUTER ============================ */
function render(){
  var v=S.view;
  var html =
    v==="site"? vSite2() :
    v==="site2"? vSite2() :
    v==="artist"? vArtistPage() :
    v==="book"? vBook() :
    v==="sent"? vSent() :
    v==="signin"? vSignin() :
    v==="desk"? vDesk() :
    v==="req"? vReq() :
    v==="approve"? vApprove() :
    v==="offered"? vOffered() :
    v==="pick"? vPick() :
    v==="pay"? vPay() :
    v==="confirmed"? vConfirmed() :
    v==="cal"? vCal() :
    v==="done"? vDone() :
    v==="payouts"? vPayouts() :
    v==="move"? vMove() :
    v==="counter"? vCounter() : vSite2();
  document.getElementById("app").innerHTML = html;

  [].forEach.call(document.querySelectorAll("#demobar .dbtn[data-go]"), function(b){
    var g=b.getAttribute("data-go");
    var on = (g==="site"&&v==="site")||(g==="artist"&&v==="artist")||(g==="site2"&&v==="site2")||(g==="book"&&["book","sent","pick","pay","confirmed"].indexOf(v)>=0)||
             (g==="signin"&&["signin","desk","req","approve","offered","cal","done"].indexOf(v)>=0&&S.me==="bob")||
             (g==="book-zarra"&&["desk","req"].indexOf(v)>=0&&S.me==="zarra")||
             (g==="counter"&&v==="counter");
    b.classList.toggle("on", !!on);
  });
}
document.addEventListener("click", function(e){
  var b=e.target.closest("#demobar .dbtn[data-go]"); if(!b) return;
  var g=b.getAttribute("data-go");
  if(g==="book-zarra"){ S.me="zarra"; S.who="artist"; go("desk"); }
  else if(g==="book"){ S.step=0; go("book"); }
  else go(g);
});
document.getElementById("flagbtn").addEventListener("click", function(){
  document.body.classList.toggle("showflags");
  this.classList.toggle("on", document.body.classList.contains("showflags"));
});
document.getElementById("resetbtn").addEventListener("click", function(){
  S=JSON.parse(JSON.stringify(SEED())); S.offerPick=[]; S.pickSlot=null;
  S.approveHrs=4; S.approveMulti=false; S.counterFilter="all"; save(); render(); window.scrollTo(0,0);
});
render();
</script>
</body>
</html>
